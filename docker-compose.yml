name: cove

services:
  cove:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VERSION: ${COVE_VERSION:-dev}   # e.g. COVE_VERSION=$(git describe --tags --always)
    environment:
      - APP_ENV=PROD
      - APP_PORT=2100
      - APP_ENV_PATH=/app/vault/.env
      - APP_MARKER_PATH=/app/vault/markers
    container_name: cove
    ports:
      - "2100:2100"
    volumes:
      - type: bind
        source: /srv/server/storage/cove/.env
        target: /app/vault/.env
        read_only: true
      - type: bind
        source: /srv/server/storage/cove/markers   
        target: /app/vault/markers
        read_only: false
    stdin_open: true  # keeps STD open for the CLI
    tty: true         # allocates a pseudo-TTY so you can interact
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2100/v0/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - spark

networks:
  spark:
    external: true