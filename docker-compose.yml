name: cove

x-lighthouse: 
  deploy: releases
  tier: infra

services:
  cove:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - COVE_VERSION=v1.0.2   # shown by `status` and in the log; bump it with each release
      - APP_ENV=PROD
      - APP_PORT=2100
      - APP_ENV_PATH=/app/vault/.env
      - APP_MARKER_PATH=/app/vault/markers
    container_name: cove
    volumes:
      - type: bind
        source: /srv/server/storage/cove/.env
        target: /app/vault/.env
        read_only: true
      - type: bind
        source: /srv/server/storage/cove/markers
        target: /app/vault/markers
        read_only: false
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2100/v0/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - spark

networks:
  spark:
    external: true